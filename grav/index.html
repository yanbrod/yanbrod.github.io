<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const isTouch = matchMedia('(pointer: coarse)').matches;   // phone/tablet → lighter grid, touch UI

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e18);
scene.fog = new THREE.FogExp2(0x0a0e18, 0.0009);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 8000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, -45, 0);
controls.maxPolarAngle = Math.PI * 0.495;   // don't go under the sheet
controls.minDistance = 6; controls.maxDistance = 1700; controls.enablePan = false;  // low min → can zoom right up to a focused body
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());          // no long-press menu

scene.add(new THREE.AmbientLight(0x3a5a70, 1.9));
const sunLight = new THREE.PointLight(0xffd9a0, 4.5, 4200, 0.9);
scene.add(sunLight);

// --- starfield ---
(function stars() {
  const N = isTouch ? 2200 : 3800, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1600 + Math.random() * 1800, t = Math.random() * Math.PI * 2,
          p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t); pos[i*3+1] = r*Math.cos(p); pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd8e6, size: 1.5, sizeAttenuation: false, fog: false })));   // fog: false — иначе туман съедает всё небо
})();

// --- bodies. Each carries STYLIZED values (…S — chosen so everything is visible at once) and the REAL
//     ratios (realM = mass in Earth-masses, realR = radius in Earth-radii, realAU = orbit in AU). The three
//     toggles swap one axis at a time to its true ratio; .radius/.mass/.orbit below are the EFFECTIVE values
//     recompute() derives from the toggle state. Well WIDTH (rwell) stays stylized — it's the sheet's dent,
//     not one of the three physical axes. ---
const G = 1;
const sun = { name: 'Sun', color: 0xff5a22, rwell: 100, x: 0, z: 0, speed: 0, ang: 0,
              radiusS: 26, massS: 13000, orbitS: 0, realR: 109.2, realM: 332946, realAU: 0 };   // 1.98841e30 kg / 5.97217e24 kg (JPL)
const planets = [
  { name: 'Mercury', color: 0x9c8a7a, rwell: 13, speed: 0.052, radiusS: 3.0, massS: 90,   orbitS: 72,  realR: 0.383, realM: 0.0553, realAU: 0.387, ecc: 0.2056, peri: 77.5, texture: 'mercury.jpg', textureNight: 'mercury_night.jpg', spin: 0.003, nightBoost: 0.85, atmoStr: 0.0 },
  { name: 'Venus',   color: 0xcaa46a, rwell: 17, speed: 0.039, radiusS: 5.0, massS: 200,  orbitS: 104, realR: 0.950, realM: 0.815,  realAU: 0.723, ecc: 0.0068, peri: 131.5, texture: 'venus.jpg', textureNight: 'venus_night.jpg', spin: -0.002, atmoColor: 0xe8c88a, atmoStr: 1.3, atmoPow: 2.0, nightBoost: 0.7 },   // spin < 0: Venus really does rotate retrograde
  { name: 'Earth',   color: 0x3f86d6, rwell: 18, speed: 0.031, radiusS: 5.3, massS: 220,  orbitS: 140, realR: 1.000, realM: 1.000,  realAU: 1.000, ecc: 0.0167, peri: 102.9, texture: 'earth.jpg', textureNight: 'earth_night.jpg', cloud: 'earth_clouds.jpg', spin: 0.004 },
  { name: 'Mars',    color: 0xc1502e, rwell: 15, speed: 0.025, radiusS: 4.0, massS: 150,  orbitS: 176, realR: 0.532, realM: 0.107,  realAU: 1.524, ecc: 0.0934, peri: 336.0, texture: 'mars.jpg', textureNight: 'mars_night.jpg', spin: 0.004, atmoColor: 0xc07a48, nightBoost: 0.85, atmoStr: 0.6, atmoPow: 5.0 },
  { name: 'Jupiter', color: 0xcaa877, rwell: 42, speed: 0.015, radiusS: 14,  massS: 1300, orbitS: 244, realR: 10.97, realM: 317.8,  realAU: 5.204, ecc: 0.0489, peri: 14.8, texture: 'jupiter.jpg', textureNight: 'jupiter_night.jpg', spin: 0.01, nightBoost: 0.9, atmoColor: 0xd8b08a, atmoStr: 0.45, atmoPow: 3.5 },   // spin 0.01: сутки 9.9 ч, самый быстрый волчок системы
  { name: 'Saturn',  color: 0xd8c48f, rwell: 38, speed: 0.011, radiusS: 12,  massS: 1000, orbitS: 312, realR: 9.14,  realM: 95.2,   realAU: 9.583, ecc: 0.0565, peri: 92.9, ring: true, texture: 'saturn.jpg', spin: 0.009, nightBoost: 0.12, atmoColor: 0xe6d3a3, atmoStr: 0.3, atmoPow: 3.5 },   // без ночной карты: ночь = день × nightBoost; сутки 10.7 ч
  { name: 'Uranus',  color: 0x9fd8de, rwell: 28, speed: 0.008, radiusS: 8,   massS: 480,  orbitS: 366, realR: 3.98,  realM: 14.5,   realAU: 19.22, ecc: 0.0457, peri: 172.4, texture: 'uranus.jpg', spin: 0.0056, tilt: 98, nightBoost: 0.12, atmoColor: 0xbfeef0, atmoStr: 0.5, atmoPow: 3.0 },   // tilt 98° — лежит на боку; сутки 17.2 ч
  { name: 'Neptune', color: 0x4f6fd6, rwell: 28, speed: 0.006, radiusS: 8,   massS: 480,  orbitS: 414, realR: 3.86,  realM: 17.1,   realAU: 30.07, ecc: 0.0113, peri: 46.7, texture: 'neptune.jpg', spin: 0.006, nightBoost: 0.12, atmoColor: 0x5f86e8, atmoStr: 0.55, atmoPow: 3.0 },   // сутки 16.1 ч
  { name: 'Pluto',   color: 0xc9b295, rwell: 8,  speed: 0.005, radiusS: 2.2, massS: 30,   orbitS: 470, realR: 0.187, realM: 0.00218, realAU: 39.48, ecc: 0.2488, peri: 224.6, texture: 'pluto.jpg', spin: -0.0006, nightBoost: 0.12, atmoColor: 0x88aadd, atmoStr: 0.25, atmoPow: 4.0 },   // дом — в поясе Койпера; спин ретроградный и ленивый (сутки 6.4 земных), голубая азотная дымка — привет New Horizons
];
const bodies = [sun, ...planets];
bodies.forEach(b => { b.radius = b.radiusS; b.mass = b.massS; b.orbit = b.orbitS; });
planets.forEach(p => { p.ang = Math.random() * Math.PI * 2; });

// sum each body's uniform-sphere well (down = negative y):
//   outside r≥R: −G·mass/r   ·   inside r<R: −G·mass·(3 − r²/R²)/(2R)   (C¹-smooth → rounded bottom)
// wellDepth ignores the "плоскость" toggle (recompute needs the true pit depth for framing); disp respects it.
function wellDepth(x, z) {
  let y = 0;
  for (const m of bodies) {
    const dx = x - m.x, dz = z - m.z, r = Math.sqrt(dx*dx + dz*dz), R = m.rwell;
    y -= (r >= R) ? G * m.mass / r : G * m.mass * (3 - (r*r)/(R*R)) / (2 * R);
  }
  return y;
}
function disp(x, z) { return real.flat ? 0 : wellDepth(x, z); }

// Kepler: p.ang — СРЕДНЯЯ аномалия; решаем E = M + e·sinE (3 итерации хватает при e ≤ 0.25),
// истинная аномалия → точка эллипса с фокусом в Солнце. Скорость у перигелия растёт сама собой —
// это закон равных площадей, а не анимационный трюк. peri — долгота перигелия (J2000), в градусах.
function orbXZ(p, out) {
  const e = p.ecc || 0, a = p.orbit;
  let E = p.ang;
  for (let i = 0; i < 3; i++) E = p.ang + e * Math.sin(E);
  const th = Math.atan2(Math.sqrt(1 - e*e) * Math.sin(E), Math.cos(E) - e);
  const r = a * (1 - e * Math.cos(E)), w = (p.peri || 0) * Math.PI / 180;
  out.x = Math.cos(th + w) * r; out.z = Math.sin(th + w) * r;
}

// --- the spacetime sheet. The wells are summed on the GPU: the vertex shader reads 9 (x, z, G·mass, rwell)
//     uniforms and displaces each vertex itself — no per-frame JS loop over ~58k verts, no buffer re-upload.
//     Same math as wellDepth(), so the sheet and the bodies always agree. ---
const S = 1900, SEG = isTouch ? 200 : 320;   // wide enough for Pluto + the Kuiper belt at real distances; fewer verts on phones
const gridMat = new THREE.ShaderMaterial({
  wireframe: true, transparent: true, fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uWells: { value: bodies.map(() => new THREE.Vector4()) },   // (x, z, G·mass, rwell) per body
    uFlat:  { value: 0 },                                       // 1 → "плоскость": no displacement
    uColor: { value: new THREE.Color(0x2ad0e6) },
  }]),
  vertexShader: `
    uniform vec4 uWells[${bodies.length}]; uniform float uFlat;
    #include <fog_pars_vertex>
    void main() {
      vec2 w = vec2(position.x, -position.y);                   // plane local (x,y) → world (x,z)
      float y = 0.0;
      for (int i = 0; i < ${bodies.length}; i++) {
        vec4 m = uWells[i];
        float r = max(distance(w, m.xy), 1e-4);
        y -= (r >= m.w) ? m.z / r : m.z * (3.0 - (r*r)/(m.w*m.w)) / (2.0 * m.w);
      }
      vec4 mvPosition = modelViewMatrix * vec4(position.xy, mix(y, 0.0, uFlat), 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform vec3 uColor;
    #include <fog_pars_fragment>
    void main() {
      gl_FragColor = vec4(uColor, 0.6);
      #include <fog_fragment>
      #include <colorspace_fragment>
    }`,
});
const grid = new THREE.Mesh(new THREE.PlaneGeometry(S, S, SEG, SEG), gridMat);
grid.rotation.x = -Math.PI / 2;              // lie flat; local +z displacement → world +y
scene.add(grid);
const uWells = gridMat.uniforms.uWells.value;

// --- sun: photographic surface + animated "boiling plasma" noise. It's the light emitter, so an unlit shader ---
const texLoader = new THREE.TextureLoader();
const sunTex = texLoader.load('sun.jpg');
sunTex.colorSpace = THREE.SRGBColorSpace; sunTex.wrapS = THREE.RepeatWrapping; sunTex.wrapT = THREE.ClampToEdgeWrapping;
sunTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const sunMat = new THREE.ShaderMaterial({
  uniforms: { sunMap: { value: sunTex }, time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vPos;
    void main(){ vUv = uv; vPos = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D sunMap; uniform float time; varying vec2 vUv; varying vec3 vPos;
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    float fbm(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<4;i++){ f+=a*snoise(p); p*=2.02; a*=0.5; } return f; }
    vec3 hash33(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
      return fract(sin(p)*43758.5453); }
    float worley(vec3 P, float t){                 // animated cellular noise → discrete churning blobs (not clouds)
      vec3 id=floor(P), fp=fract(P); float d=1.0;
      for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){
        vec3 o=vec3(float(x),float(y),float(z));
        vec3 pt=hash33(id+o); pt=0.5+0.5*sin(t+6.2831*pt);               // feature point wanders → boil
        vec3 r=o+pt-fp; d=min(d, dot(r,r));
      }
      return sqrt(d);
    }
    void main(){
      vec3 p = vPos;
      float w = fbm(p*2.5 + vec3(0.0, time*0.05, 0.0));                  // slow warp field
      float n = fbm(p*3.5 + w*1.2 + vec3(time*0.06, 0.0, time*0.04));    // churning cells (previous "spots" variant)
      float boil = 0.5 + 0.5*n;
      float shade = pow(clamp(boil, 0.0, 1.0), 1.3);                     // contrast curve
      vec3 base = texture2D(sunMap, vUv).rgb;
      vec3 col = base * mix(0.5, 1.25, shade);                           // lighter floor → hotter disc, boil still reads
      col += vec3(1.0, 0.82, 0.4) * smoothstep(0.80, 1.0, boil) * 0.6;   // brighter flares
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sun.radiusS, 48, 48), sunMat);
scene.add(sunMesh);

// --- solar prominences: plasma flowing inside magnetic loops (per Ian's plan) ---
// several loops anchored by two footpoints on the surface, arched via sin(πt)^1.35; particles stream along each
// loop with cross-flow noise; some strands descend (coronal rain). Rendered as additive points, dark-red→white.
const promGeo = new THREE.BufferGeometry();
const PROM = (() => {
  const V = THREE.Vector3, rng = Math.random, R = sun.radiusS, SEG = 48;
  const slerp = (a, b, t, o) => {
    const d = THREE.MathUtils.clamp(a.dot(b), -1, 1), th = Math.acos(d);
    if (th < 1e-4) return o.copy(a).lerp(b, t).normalize();
    const s = Math.sin(th);
    return o.copy(a).multiplyScalar(Math.sin((1-t)*th)/s).addScaledVector(b, Math.sin(t*th)/s).normalize();
  };
  const strands = [], proms = [], N_PROM = isTouch ? 3 : 4, tmp = new V();
  for (let pi = 0; pi < N_PROM; pi++) {
    const base = new V(rng()*2-1, rng()*1.3-0.15, rng()*2-1).normalize();

  for (const p of planets) p.mass = real.mass ? sun.massS * (p.realM / sun.realM) : p.massS;

  // 5) push effective sizes to the meshes (orbit lines read planet state live in updateOrbitLines)
  sunMesh.scale.setScalar(sun.radius / sun.radiusS);
  planets.forEach((p, i) => planetMeshes[i].scale.setScalar(p.radius / p.radiusS));

  // 6) reframe: zoom out far enough to hold the outermost orbit. With real distances the whole inner
  //    system sinks ~250 units into the sun's (still stylized) well — aim the camera INTO the pit,
  //    otherwise the home view frames an empty funnel with an invisible dot at the bottom.
  controls.maxDistance = Math.max(1700, maxOrbit * 1.9);
  homeDist = real.dist ? Math.max(360, maxOrbit * 1.3) : 360;
  CENTER.set(0, real.dist ? Math.min(-45, wellDepth(0, 0) * 0.7) : -45, 0);
  if (focus) { focusZoomLimits(); retarget = true; }           // reframe the focused body at the new scale…
  else if (reframe) resetView();                               // …else recenter
}

// --- UI: mode chips ---
const MODE_LABEL = { mass: 'массы', size: 'размеры', dist: 'дистанции', flat: 'плоскость' };
const modeBtns = {};
function paintMode(k) {
  const b = modeBtns[k];
  b.classList.toggle('on', real[k]);
  b.textContent = (real[k] ? '● ' : '○ ') + MODE_LABEL[k];
}
function toggleMode(k) {
  real[k] = !real[k]; paintMode(k); linesDirty = true;
  if (k !== 'flat') recompute(k === 'dist');   // only a distance flip re-frames the camera
}
document.querySelectorAll('#modes button').forEach(b => {
  modeBtns[b.dataset.k] = b; paintMode(b.dataset.k); b.onclick = () => toggleMode(b.dataset.k);
});

let paused = false;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // don't shadow browser shortcuts (⌘R, ctrl+1…)
  if (e.code === 'Space') { paused = !paused; bPause.textContent = paused ? '▶' : '⏸'; e.preventDefault(); }
  if (e.key === 'o') { showOrbits = !showOrbits; orbitLines.forEach(o => o.line.visible = showOrbits); }
  if (e.key === 'r') { freeRoam(); resetView(); }
  if (e.key === 'f') cycleFocus();
  if (e.key === '1') toggleMode('mass');
  if (e.key === '2') toggleMode('size');
  if (e.key === '3') toggleMode('dist');
  if (e.key === '4') toggleMode('flat');
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));   // окно могли перетащить на экран с другим DPR
  renderer.setSize(innerWidth, innerHeight);
});

// --- on-screen controls (touch has no keyboard) + gesture-aware hint ---
document.getElementById('hud').innerHTML = isTouch
  ? 'вращай пальцем · щипок — зум · <b>тапни тело</b> или выбери снизу'
  : 'мышь — орбита · колесо — зум · <b>пробел</b> пауза · <b>o</b> орбиты · <b>1/2/3/4</b> режимы · <b>f</b> фокус · <b>r</b> обзор · <b>клик по телу</b> или снизу';
const bPause = document.getElementById('bPause'),
      bOrbit = document.getElementById('bOrbit'),
      bReset = document.getElementById('bReset');
bPause.onclick = () => { paused = !paused; bPause.textContent = paused ? '▶' : '⏸'; };
bOrbit.onclick = () => { showOrbits = !showOrbits; linesDirty = true; orbitLines.forEach(o => o.line.visible = showOrbits); bOrbit.style.opacity = showOrbits ? 1 : .4; };
bReset.onclick = () => { freeRoam(); resetView(); };

// --- focus / free-roam: tap a body (in the scene or the picker strip) → camera flies to it & follows; ⟲ / r = free roam ---
const CENTER = new THREE.Vector3(0, -45, 0);
const RU = { Sun: 'Солнце', Mercury: 'Меркурий', Venus: 'Венера', Earth: 'Земля', Mars: 'Марс',
             Jupiter: 'Юпитер', Saturn: 'Сатурн', Uranus: 'Уран', Neptune: 'Нептун', Pluto: 'Плутон' };
const focusOrder = [sun, ...planets];
const focusEl = document.getElementById('focus');
const picker = document.getElementById('picker');
const pickBtns = [];
const hex = c => '#' + c.toString(16).padStart(6, '0');
[null, ...focusOrder].forEach(b => {                       // pill 0 = обзор (free roam), then one per body
  const btn = document.createElement('button');
  btn.innerHTML = (b ? `<span class="dot" style="--c:${hex(b.color)}"></span>` : '') + (b ? (RU[b.name] || b.name) : 'обзор');
  btn.onclick = () => setFocus(b);
  picker.appendChild(btn); pickBtns.push(btn);
});
function paintFocus() {
  focusEl.textContent = focus ? '◎ ' + (RU[focus.name] || focus.name) : '◎ обзор';
  const active = focus ? focusOrder.indexOf(focus) + 1 : 0;
  pickBtns.forEach((b, i) => b.classList.toggle('on', i === active));
  pickBtns[active].scrollIntoView({ block: 'nearest', inline: 'center' });
}
function focusZoomLimits() {   // подпустить камеру к телу любого размера (в честных режимах Земля — сотые доли единицы)
  controls.minDistance = focus ? Math.min(6, Math.max(0.12, focus.radius * 1.2)) : 6;
}
function setFocus(b) { focus = b; focusIdx = b ? focusOrder.indexOf(b) : -1; focusZoomLimits(); retarget = true; paintFocus(); }
function cycleFocus() { setFocus(focusOrder[(focusIdx + 1) % focusOrder.length]); }
function freeRoam() { setFocus(null); }
paintFocus();

// tap (not drag) on a body in the scene focuses it — the intuitive path; the picker is the visible one
const ray = new THREE.Raycaster();
let dnX = 0, dnY = 0, dnT = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (!e.isPrimary) return; dnX = e.clientX; dnY = e.clientY; dnT = performance.now(); retarget = false; }, { passive: true });
renderer.domElement.addEventListener('wheel', () => { retarget = false; }, { passive: true });
renderer.domElement.addEventListener('pointerup', e => {
  if (!e.isPrimary) return;                                                                        // второй палец щипка — не тап
  if (performance.now() - dnT > 350 || Math.hypot(e.clientX - dnX, e.clientY - dnY) > 6) return;   // that was a drag, not a tap
  const rect = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1,
                                      -((e.clientY - rect.top) / rect.height) * 2 + 1), camera);
  const hit = ray.intersectObjects([sunMesh, ...planetMeshes], true).find(h => !h.object.isPoints);   // частицы (протуберанцы, пояса) — не мишень
  if (!hit) return;
  let o = hit.object; while (o && o !== sunMesh && !planetMeshes.includes(o)) o = o.parent;
  const b = o === sunMesh ? sun : (planetMeshes.includes(o) ? planets[planetMeshes.indexOf(o)] : null);
  if (b) setFocus(b);
}, { passive: true });

recompute();   // set the initial (all-stylized) state + frame the view

// expose a small handle so the camera / modes can be scripted (screenshots from set angles)
window.grav = {
  camera, controls, scene, THREE, real,
  setView(theta, phi, R) {            // spherical around the target: theta=azimuth, phi=polar from +Y
    const t = controls.target;
    camera.position.set(t.x + R * Math.sin(phi) * Math.sin(theta),
                        t.y + R * Math.cos(phi),
                        t.z + R * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(t); controls.update();
  },
  setModes(m) { Object.assign(real, m); for (const k in MODE_LABEL) paintMode(k); recompute(); },
  focusBody(name) { setFocus(name ? focusOrder.find(b => b.name === name) : null); },
  pause(v) { paused = v; bPause.textContent = v ? '▶' : '⏸'; },
};

// all speeds are delta-time based. F = "frames at 120 Hz": the constants below were tuned on a 120 Hz
// display, so F keeps that exact look on any refresh rate (60 Hz laptops, 144 Hz monitors, throttled tabs).
const clock = new THREE.Clock();
let linesDirty = true;                     // orbit lines need a rebuild (scale/flat toggled, or just unhidden)
const _prevT = new THREE.Vector3(), _dT = new THREE.Vector3(), _off = new THREE.Vector3();   // no per-frame allocs

function updateOrbitLines() {
  orbitLines.forEach(o => {
    const pos = o.line.geometry.attributes.position;
    const a = o.p.orbit, e = o.p.ecc || 0, w = (o.p.peri || 0) * Math.PI / 180;
    const lift = Math.min(0.6, o.p.radius * 0.6 + 0.015);   // подъём линии над листом — в масштабе планеты, иначе в честных режимах её «сносит с орбиты»
    for (let k = 0; k < o.N; k++) {
      const th = k / o.N * Math.PI * 2, r = a * (1 - e*e) / (1 + e * Math.cos(th));   // сам эллипс, фокус в Солнце
      const x = Math.cos(th + w) * r, z = Math.sin(th + w) * r;
      pos.setXYZ(k, x, disp(x, z) + lift, z);
    }
    pos.needsUpdate = true;
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp: a backgrounded tab must not fast-forward on return
  const F = dt * 120;
  // ang -= : orbital motion now matches the spins (both CCW from the north), as in the real system
  if (!paused) for (const p of planets) p.ang -= p.speed * 0.02 * F;
  for (const p of planets) orbXZ(p, p);   // Kepler-позиция; вне pause-guard: переключения масштабов работают и на паузе
  bodies.forEach((b, i) => uWells[i].set(b.x, b.z, G * b.mass, b.rwell));   // feed the GPU sheet
  gridMat.uniforms.uFlat.value = real.flat ? 1 : 0;   // пояса делят этот uniform — выпрямляет и их
  grid.visible = !real.flat;                          // «плоскость» = убрать лист совсем: чистая карта системы
  const sy = disp(0, 0);
  sunMesh.position.set(0, sy + sun.radius, 0);   // bottom rests at the sheet's low point — sits IN the fabric, never below it
  sunLight.position.copy(sunMesh.position);
  SUN_POS.value.copy(sunMesh.position);          // rocks in the belts are lit from here
  if (!paused) {
    sunMat.uniforms.time.value += 0.026 * F; sunMesh.rotation.y += 0.0012 * F;   // boil + slow axial spin
    PROM.update(sunMat.uniforms.time.value);   // flow plasma along the magnetic loops (frozen buffers keep the picture while paused)
    BELT_TIME.value += 0.02 * F;               // asteroid belts drift on the same clock as the planets
  }
  planets.forEach((p, i) => {
    planetMeshes[i].position.set(p.x, disp(p.x, p.z) + p.radius, p.z);
    if (!paused && p.spin) planetMeshes[i].rotation.y += p.spin * F;
    if (p._mat) {
      const sdv = p._mat.uniforms.sunDir.value.copy(sunMesh.position).sub(planetMeshes[i].position);
      sdv.y = 0; sdv.normalize();                                     // light in-plane → terminator through the poles (grazing twilight, not permanent night)
      if (p._cloudMat) {
        p._cloudMat.uniforms.sunDir.value.copy(sdv);
        if (!paused) p._cloud.rotation.y += 0.0006 * F;               // clouds drift relative to the surface
      }
    }
  });
  if (showOrbits && (!paused || linesDirty)) { updateOrbitLines(); linesDirty = false; }   // hidden or static → skip
  // camera: follow the focused body (or ease back to centre), smooth-zooming to frame it.
  // the camera translates WITH the target, so the follow distance holds even for fast planets.
  const pivot = focus ? (focus === sun ? sunMesh.position : planetMeshes[planets.indexOf(focus)].position) : CENTER;
  _prevT.copy(controls.target);
  controls.target.lerp(pivot, 1 - Math.pow(0.85, F));                 // rate-independent “0.15 per 120 Hz frame”
  camera.position.add(_dT.subVectors(controls.target, _prevT));
  if (retarget) {
    const want = focus ? Math.max(focus.radius * 7, controls.minDistance * 2.2) : homeDist;   // и для крошек честных размеров
    _off.subVectors(camera.position, controls.target);
    const nd = THREE.MathUtils.lerp(_off.length(), want, 1 - Math.pow(0.88, F));
    camera.position.copy(controls.target).add(_off.setLength(nd));
    if (Math.abs(nd - want) < Math.max(want * 0.04, 0.02)) retarget = false;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
