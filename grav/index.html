<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const isTouch = matchMedia('(pointer: coarse)').matches;   // phone/tablet → lighter grid, touch UI

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e18);
scene.fog = new THREE.FogExp2(0x0a0e18, 0.0009);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 8000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, -45, 0);
controls.maxPolarAngle = Math.PI * 0.495;   // don't go under the sheet
controls.minDistance = 6; controls.maxDistance = 1700; controls.enablePan = false;  // low min → can zoom right up to a focused body
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());          // no long-press menu

scene.add(new THREE.AmbientLight(0x3a5a70, 1.9));
const sunLight = new THREE.PointLight(0xffd9a0, 4.5, 4200, 0.9);
scene.add(sunLight);

// --- starfield ---
(function stars() {
  const N = isTouch ? 2200 : 3800, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1600 + Math.random() * 1800, t = Math.random() * Math.PI * 2,
          p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t); pos[i*3+1] = r*Math.cos(p); pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd8e6, size: 1.5, sizeAttenuation: false })));
})();

// --- bodies. Each carries STYLIZED values (…S — chosen so everything is visible at once) and the REAL
//     ratios (realM = mass in Earth-masses, realR = radius in Earth-radii, realAU = orbit in AU). The three
//     toggles swap one axis at a time to its true ratio; .radius/.mass/.orbit below are the EFFECTIVE values
//     recompute() derives from the toggle state. Well WIDTH (rwell) stays stylized — it's the sheet's dent,
//     not one of the three physical axes. ---
const G = 1;
const sun = { name: 'Sun', color: 0xff5a22, rwell: 100, x: 0, z: 0, speed: 0, ang: 0,
              radiusS: 26, massS: 13000, orbitS: 0, realR: 109.2, realM: 333000, realAU: 0 };
const planets = [
  { name: 'Mercury', color: 0x9c8a7a, rwell: 13, speed: 0.052, radiusS: 3.0, massS: 90,   orbitS: 72,  realR: 0.383, realM: 0.0553, realAU: 0.387 },
  { name: 'Venus',   color: 0xcaa46a, rwell: 17, speed: 0.039, radiusS: 5.0, massS: 200,  orbitS: 104, realR: 0.950, realM: 0.815,  realAU: 0.723 },
  { name: 'Earth',   color: 0x3f86d6, rwell: 18, speed: 0.031, radiusS: 5.3, massS: 220,  orbitS: 140, realR: 1.000, realM: 1.000,  realAU: 1.000, texture: 'earth.jpg', textureNight: 'earth_night.jpg', spin: 0.004 },
  { name: 'Mars',    color: 0xc1502e, rwell: 15, speed: 0.025, radiusS: 4.0, massS: 150,  orbitS: 176, realR: 0.532, realM: 0.107,  realAU: 1.524 },
  { name: 'Jupiter', color: 0xcaa877, rwell: 42, speed: 0.015, radiusS: 14,  massS: 1300, orbitS: 244, realR: 10.97, realM: 317.8,  realAU: 5.204 },
  { name: 'Saturn',  color: 0xd8c48f, rwell: 38, speed: 0.011, radiusS: 12,  massS: 1000, orbitS: 312, realR: 9.14,  realM: 95.2,   realAU: 9.583, ring: true },
  { name: 'Uranus',  color: 0x9fd8de, rwell: 28, speed: 0.008, radiusS: 8,   massS: 480,  orbitS: 366, realR: 3.98,  realM: 14.5,   realAU: 19.22 },
  { name: 'Neptune', color: 0x4f6fd6, rwell: 28, speed: 0.006, radiusS: 8,   massS: 480,  orbitS: 414, realR: 3.86,  realM: 17.1,   realAU: 30.07 },
];
const bodies = [sun, ...planets];
bodies.forEach(b => { b.radius = b.radiusS; b.mass = b.massS; b.orbit = b.orbitS; });
planets.forEach(p => { p.ang = Math.random() * Math.PI * 2; });
const masses = bodies;

// sum each body's uniform-sphere well (down = negative y):
//   outside r≥R: −G·mass/r   ·   inside r<R: −G·mass·(3 − r²/R²)/(2R)   (C¹-smooth → rounded bottom)
function disp(x, z) {
  let y = 0;
  for (const m of masses) {
    const dx = x - m.x, dz = z - m.z, r = Math.sqrt(dx*dx + dz*dz), R = m.rwell;
    y -= (r >= R) ? G * m.mass / r : G * m.mass * (3 - (r*r)/(R*R)) / (2 * R);
  }
  return y;
}

// --- the spacetime sheet (wireframe grid, displaced by disp every frame) ---
const S = 1300, SEG = isTouch ? 150 : 240;   // fewer verts on phones
const gridGeo = new THREE.PlaneGeometry(S, S, SEG, SEG);
const grid = new THREE.Mesh(gridGeo, new THREE.MeshBasicMaterial({ color: 0x2ad0e6, wireframe: true, transparent: true, opacity: 0.6 }));
grid.rotation.x = -Math.PI / 2;              // lie flat; local +z displacement → world +y
scene.add(grid);
const gp = gridGeo.attributes.position;
const gx = new Float32Array(gp.count), gz = new Float32Array(gp.count);
for (let i = 0; i < gp.count; i++) { gx[i] = gp.getX(i); gz[i] = -gp.getY(i); }   // local (x,y) → world (x,-y)
function updateGrid() { for (let i = 0; i < gp.count; i++) gp.setZ(i, disp(gx[i], gz[i])); gp.needsUpdate = true; }

// --- sun: photographic surface + animated "boiling plasma" noise. It's the light emitter, so an unlit shader ---
const texLoader = new THREE.TextureLoader();
const sunTex = texLoader.load('sun.jpg');
sunTex.colorSpace = THREE.SRGBColorSpace; sunTex.wrapS = THREE.RepeatWrapping; sunTex.wrapT = THREE.ClampToEdgeWrapping;
sunTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const sunMat = new THREE.ShaderMaterial({
  uniforms: { sunMap: { value: sunTex }, time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vPos;
    void main(){ vUv = uv; vPos = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D sunMap; uniform float time; varying vec2 vUv; varying vec3 vPos;
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    float fbm(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<4;i++){ f+=a*snoise(p); p*=2.02; a*=0.5; } return f; }
    vec3 hash33(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
      return fract(sin(p)*43758.5453); }
    float worley(vec3 P, float t){                 // animated cellular noise → discrete churning blobs (not clouds)
      vec3 id=floor(P), fp=fract(P); float d=1.0;
      for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){
        vec3 o=vec3(float(x),float(y),float(z));
        vec3 pt=hash33(id+o); pt=0.5+0.5*sin(t+6.2831*pt);               // feature point wanders → boil
        vec3 r=o+pt-fp; d=min(d, dot(r,r));
      }
      return sqrt(d);
    }
    void main(){
      vec3 p = vPos;
      float w = fbm(p*2.5 + vec3(0.0, time*0.05, 0.0));                  // slow warp field
      float n = fbm(p*3.5 + w*1.2 + vec3(time*0.06, 0.0, time*0.04));    // churning cells (previous "spots" variant)
      float boil = 0.5 + 0.5*n;
      float shade = pow(clamp(boil, 0.0, 1.0), 1.3);                     // contrast curve
      vec3 base = texture2D(sunMap, vUv).rgb;
      vec3 col = base * mix(0.5, 1.25, shade);                           // lighter floor → hotter disc, boil still reads
      col += vec3(1.0, 0.82, 0.4) * smoothstep(0.80, 1.0, boil) * 0.6;   // brighter flares
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sun.radiusS, 48, 48), sunMat);
scene.add(sunMesh);
// erupting plasma: an additive shell whose vertices SHOOT OUTWARD along the radius by animated noise → jets, not a shell
const flameMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } }, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    uniform float time; varying float vE;
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    float fbm(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<4;i++){ f+=a*snoise(p); p*=2.02; a*=0.5; } return f; }
    void main(){
      vec3 dir = normalize(position);
      float n = fbm(dir*3.3 + vec3(time*0.3, time*0.2, 0.0));
      float mask = smoothstep(0.35, 0.70, n);                             // eruption spots (a few active at any time)
      float pulse = pow(0.5 + 0.5*sin(time*1.6 + n*15.0 + dir.y*7.0), 2.0);  // decorrelated shoot-out / retract
      float e = mask * pulse;
      vE = e;
      vec3 pos = position + dir * e * ${(sun.radiusS * 1.4).toFixed(2)};  // jets reach far out along the radius
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`,
  fragmentShader: `
    varying float vE;
    void main(){
      float a = smoothstep(0.015, 0.28, vE);                             // only erupting parts glow
      vec3 col = mix(vec3(1.0, 0.30, 0.04), vec3(1.0, 0.92, 0.55), vE);   // red base → hot yellow tips
      gl_FragColor = vec4(col * a, a);
    }`,
});
// plasma jets disabled (flameMat kept above, unused)

// --- solar prominences: plasma flowing inside magnetic loops (per Ian's plan) ---
// several loops anchored by two footpoints on the surface, arched via sin(πt)^1.35; particles stream along each
// loop with cross-flow noise; some strands descend (coronal rain). Rendered as additive points, dark-red→white.
const promGeo = new THREE.BufferGeometry();
const PROM = (() => {
  const V = THREE.Vector3, rng = Math.random, R = sun.radiusS, SEG = 48;
  const slerp = (a, b, t, o) => {
    const d = THREE.MathUtils.clamp(a.dot(b), -1, 1), th = Math.acos(d);
    if (th < 1e-4) return o.copy(a).lerp(b, t).normalize();
    const s = Math.sin(th);
    return o.copy(a).multiplyScalar(Math.sin((1-t)*th)/s).addScaledVector(b, Math.sin(t*th)/s).normalize();
  };
  const strands = [], proms = [], N_PROM = isTouch ? 3 : 4, tmp = new V();
  for (let pi = 0; pi < N_PROM; pi++) {
    const base = new V(rng()*2-1, rng()*1.3-0.15, rng()*2-1).normalize();
    const tang = new V();
    do { tang.set(rng()*2-1, rng()*2-1, rng()*2-1); tang.addScaledVector(base, -tang.dot(base)); } while (tang.lengthSq() < 0.05);
    tang.normalize();                                                 // tangent to the sphere at base (guarded ≠ 0)
    const sep = 0.16 + rng()*0.12;
    const start = base.clone().addScaledVector(tang, sep).normalize();
    const end   = base.clone().addScaledVector(tang, -sep).normalize();
    const sideV = new V().crossVectors(start, end).normalize();       // out of the loop plane → lateral fan
    const baseH = R * (0.7 + rng()*0.7), nStrand = 5 + Math.floor(rng()*4);
    proms.push({ period: 7 + rng()*8, phase: rng()*20, on: false, s: 0 });   // each loop's own burst clock
    for (let s = 0; s < nStrand; s++) {
      const lateral = (s/(nStrand-1) - 0.5) * R * 0.5, h = baseH * (0.75 + rng()*0.4);
      const pts = new Float32Array((SEG+1)*3), tans = new Float32Array((SEG+1)*3);
      for (let j = 0; j <= SEG; j++) {
        const t = j/SEG, arch = Math.pow(Math.sin(Math.PI*t), 1.35);
        slerp(start, end, t, tmp).multiplyScalar(R + h*arch).addScaledVector(sideV, lateral*arch);
        pts[j*3]=tmp.x; pts[j*3+1]=tmp.y; pts[j*3+2]=tmp.z;
      }
      for (let j = 0; j <= SEG; j++) {
        const a = Math.max(0,j-1)*3, b = Math.min(SEG,j+1)*3;
        tans[j*3]=pts[b]-pts[a]; tans[j*3+1]=pts[b+1]-pts[a+1]; tans[j*3+2]=pts[b+2]-pts[a+2];
      }
      strands.push({ pts, tans, dir: (s % 4 === 0) ? -1 : 1, prom: pi });   // every 4th strand flows back down
    }
  }
  const PER = isTouch ? 55 : 85, N = strands.length * PER;
  const pos = new Float32Array(N*3), temp = new Float32Array(N), size = new Float32Array(N), alpha = new Float32Array(N), meta = [];
  for (let si = 0; si < strands.length; si++) for (let k = 0; k < PER; k++) {
    size[si*PER+k] = 2.5 + rng()*3.5;
    meta.push({ st: strands[si], lane: rng(), seed: rng()*100, width: R*(0.05+rng()*0.10) });   // lane = place in the packet
  }
  promGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  promGeo.setAttribute('aTemp', new THREE.BufferAttribute(temp, 1));
  promGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  promGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const c = new V(), tg = new V(), rad = new V(), sd = new V(), nm = new V();
  const BURST = 0.18, TAIL = 0.6;
  const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x-e0)/(e1-e0))); return t*t*(3-2*t); };
  function update(clock) {
    for (let p = 0; p < proms.length; p++) {                          // each loop mostly dormant; occasionally one fires
      const pr = proms[p]; let u = ((clock + pr.phase) / pr.period) % 1; if (u < 0) u += 1;
      pr.on = u < BURST; pr.s = pr.on ? u / BURST : 0;
    }
    for (let i = 0; i < N; i++) {
      const m = meta[i], st = m.st, pr = proms[st.prom];
      if (!pr.on) { alpha[i] = 0; continue; }                          // dormant loop → particle hidden
      let t = pr.s * (1 + TAIL) - m.lane * TAIL;                       // a limited packet travelling along one arc
      if (st.dir < 0) t = 1 - t;
      if (t < 0 || t > 1) { alpha[i] = 0; continue; }
      const f = t*SEG, j = Math.floor(f), fr = f-j, j3 = j*3, k3 = Math.min(SEG, j+1)*3;
      c.set(st.pts[j3]+(st.pts[k3]-st.pts[j3])*fr, st.pts[j3+1]+(st.pts[k3+1]-st.pts[j3+1])*fr, st.pts[j3+2]+(st.pts[k3+2]-st.pts[j3+2])*fr);
      tg.set(st.tans[j3]+(st.tans[k3]-st.tans[j3])*fr, st.tans[j3+1]+(st.tans[k3+1]-st.tans[j3+1])*fr, st.tans[j3+2]+(st.tans[k3+2]-st.tans[j3+2])*fr);
      if (tg.lengthSq() < 1e-8) tg.set(0, 1, 0); tg.normalize();
      rad.copy(c).normalize(); sd.crossVectors(tg, rad);
      if (sd.lengthSq() < 1e-6) sd.set(rad.y, rad.z, rad.x);
      sd.normalize(); nm.crossVectors(sd, tg).normalize();
      const n1 = Math.sin(t*13.0+m.seed+clock*0.9)*0.6 + Math.sin(t*27.0+m.seed*2.1+clock*1.7)*0.4;
      const n2 = Math.cos(t*11.0+m.seed*1.3+clock*0.8)*0.6 + Math.cos(t*23.0+m.seed*0.7+clock*1.4)*0.4;
      pos[i*3]  = c.x + nm.x*n1*m.width + sd.x*n2*m.width;
      pos[i*3+1]= c.y + nm.y*n1*m.width + sd.y*n2*m.width;
      pos[i*3+2]= c.z + nm.z*n1*m.width + sd.z*n2*m.width;
      const arch = Math.pow(Math.sin(Math.PI*t), 1.2);
      temp[i] = Math.min(1, arch*0.6 + 0.12*(n1+1.0));
      alpha[i] = ss(0.0, 0.1, t) * ss(1.0, 0.9, t);                    // fade in/out at the footpoints
    }

    promGeo.attributes.aTemp.needsUpdate = true;

const promMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float aTemp; attribute float aSize; attribute float aAlpha; varying float vT; varying float vA;
    void main(){ vT = aTemp; vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (520.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vT; varying float vA;
    void main(){
      if (vA <= 0.001) discard;
      float r = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, r); a = a*a*0.55*vA;
      vec3 dark = vec3(1.0,0.06,0.005), hot = vec3(1.0,0.6,0.12), core = vec3(1.0,0.95,0.7);
      vec3 col = mix(dark, hot, vT); col = mix(col, core, pow(vT, 8.0));
      gl_FragColor = vec4(col * a, a);
    }`,
});
const prominences = new THREE.Points(promGeo, promMat);
sunMesh.add(prominences);

const planetMeshes = planets.map(p => {
  let mat, seg = 28;
  if (p.texture) {                                   // day/night Earth on standard sphere UV (U=longitude, V=latitude)
    const cfg = t => { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping;   // longitude wraps → seam on far side
                       t.wrapT = THREE.ClampToEdgeWrapping;                                    // latitude clamps at the poles
                       t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
    const day = cfg(texLoader.load(p.texture)), night = cfg(texLoader.load(p.textureNight));
    mat = new THREE.ShaderMaterial({
      uniforms: { dayMap: { value: day }, nightMap: { value: night },
                  sunDir: { value: new THREE.Vector3(1, 0, 0) }, atmo: { value: new THREE.Color(0x3aa0ff) } },
      vertexShader: `
        varying vec2 vUv; varying vec3 vN; varying vec3 vW;
        void main() { vUv = uv; vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp; }`,
      fragmentShader: `
        uniform sampler2D dayMap, nightMap; uniform vec3 sunDir, atmo;
        varying vec2 vUv; varying vec3 vN; varying vec3 vW;
        void main() {
          vec3 N = normalize(vN); float ndl = dot(N, normalize(sunDir));
          float d = smoothstep(-0.12, 0.20, ndl);                       // soft day/night terminator
          vec3 dayC = texture2D(dayMap, vUv).rgb * (0.55 + 0.45 * clamp(ndl, 0.0, 1.0));
          vec3 nightC = texture2D(nightMap, vUv).rgb * 1.7;             // city lights on the dark side
          vec3 col = mix(nightC, dayC, d);
          vec3 V = normalize(cameraPosition - vW);
          float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5);              // fresnel limb → atmosphere
          col += atmo * rim * (0.25 + 0.75 * smoothstep(-0.25, 0.6, ndl));  // faint all round, brighter sunward
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    p._mat = mat; seg = 64;
  } else {
    mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.05,
      emissive: p.color, emissiveIntensity: 0.4 });
  }
  const m = new THREE.Mesh(new THREE.SphereGeometry(p.radiusS, seg, seg), mat);
  if (p.ring) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(p.radiusS * 1.5, p.radiusS * 2.3, 48),
      new THREE.MeshBasicMaterial({ color: 0xd8c48f, side: THREE.DoubleSide, transparent: true, opacity: 0.5 }));
    ring.rotation.x = -Math.PI / 2.3; m.add(ring);
  }
  scene.add(m); return m;
});

// --- warped orbit rings drawn on the sheet ---
let showOrbits = true;
const orbitLines = planets.map(p => {
  const N = 220, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  const line = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x49b8ce, transparent: true, opacity: 0.55 }));
  scene.add(line); return { line, N, r: p.orbit };
});

// --- the three "real vs stylized" toggles ---
const real = { mass: false, size: false, dist: false };
const AU_UNIT = 18;      // units per AU when distances are real → Neptune ≈ 541, fits the sheet
const MIN_VIS = 0.7;     // a body never fully vanishes
let homeDist = 360;      // camera framing distance for reset (grows when the system spreads out)
let focus = null, focusIdx = -1, retarget = false;   // camera focus: null = free roam, else a body

function resetView() {
  camera.position.set(0, homeDist * 0.417, homeDist);   // homeDist=360 reproduces the classic (0,150,360)
  controls.target.set(0, -45, 0);
  controls.update();
}

// derive effective radius/mass/orbit for every body from the toggle state, then reframe
function recompute() {
  // 1) orbits — true AU ratios, or the stylized spread
  for (const p of planets) p.orbit = real.dist ? p.realAU * AU_UNIT : p.orbitS;
  const orbits = planets.map(p => p.orbit);
  const innermost = Math.min(...orbits), maxOrbit = Math.max(...orbits);

  // 2) radii — true size ratios (anchored so the Sun keeps its stylized size), or the stylized sizes
  for (const b of bodies) b.radius = real.size ? Math.max(MIN_VIS, sun.radiusS * (b.realR / sun.realR)) : b.radiusS;

  // 3) if orbits are real the inner system is tiny — shrink every body uniformly so the Sun clears
  //    the innermost orbit. (At true orbital scale the Sun really IS a dot; this is that fact.)
  if (real.dist) {
    const f = Math.min(1, (0.42 * innermost) / sun.radius);
    for (const b of bodies) b.radius = Math.max(1.0, b.radius * f);
  }

  // 4) masses (well depth) — Sun anchored; planets by true mass ratio → their dimples all but vanish
  sun.mass = sun.massS;
  for (const p of planets) p.mass = real.mass ? sun.massS * (p.realM / sun.realM) : p.massS;

  // 5) push effective sizes to the meshes + orbit lines
  sunMesh.scale.setScalar(sun.radius / sun.radiusS);
  planets.forEach((p, i) => planetMeshes[i].scale.setScalar(p.radius / p.radiusS));
  orbitLines.forEach((o, i) => { o.r = planets[i].orbit; });

  // 6) reframe: zoom out far enough to hold the outermost orbit
  controls.maxDistance = Math.max(1700, maxOrbit * 1.9);
  homeDist = real.dist ? Math.max(360, maxOrbit * 1.3) : 360;
  if (focus) retarget = true; else resetView();   // reframe the focused body at the new scale, else recenter
}

// --- UI: mode chips ---
const MODE_LABEL = { mass: 'массы', size: 'размеры', dist: 'дистанции' };
const modeBtns = {};
function paintMode(k) {
  const b = modeBtns[k];
  b.classList.toggle('on', real[k]);
  b.textContent = (real[k] ? '● ' : '○ ') + MODE_LABEL[k];
}
function toggleMode(k) { real[k] = !real[k]; paintMode(k); recompute(); }
document.querySelectorAll('#modes button').forEach(b => {
  modeBtns[b.dataset.k] = b; paintMode(b.dataset.k); b.onclick = () => toggleMode(b.dataset.k);
});

let paused = false;
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; bPause.textContent = paused ? '▶' : '⏸'; e.preventDefault(); }
  if (e.key === 'o') { showOrbits = !showOrbits; orbitLines.forEach(o => o.line.visible = showOrbits); }
  if (e.key === 'r') { freeRoam(); resetView(); }
  if (e.key === 'f') cycleFocus();
  if (e.key === '1') toggleMode('mass');
  if (e.key === '2') toggleMode('size');
  if (e.key === '3') toggleMode('dist');
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- on-screen controls (touch has no keyboard) + gesture-aware hint ---
document.getElementById('hud').innerHTML = isTouch
  ? 'rotate · pinch · <b>tap a body</b> or pick one below to fly to it'
  : 'drag orbit · scroll zoom · <b>space</b> pause · <b>o</b> orbits · <b>1/2/3</b> real · <b>click a body</b> or pick below';
const bPause = document.getElementById('bPause'),
      bOrbit = document.getElementById('bOrbit'),
      bReset = document.getElementById('bReset');
bPause.onclick = () => { paused = !paused; bPause.textContent = paused ? '▶' : '⏸'; };
bOrbit.onclick = () => { showOrbits = !showOrbits; orbitLines.forEach(o => o.line.visible = showOrbits); bOrbit.style.opacity = showOrbits ? 1 : .4; };
bReset.onclick = () => { freeRoam(); resetView(); };

// --- focus / free-roam: tap a body (in the scene or the picker strip) → camera flies to it & follows; ⟲ / r = free roam ---
const CENTER = new THREE.Vector3(0, -45, 0);
const RU = { Sun: 'Солнце', Mercury: 'Меркурий', Venus: 'Венера', Earth: 'Земля', Mars: 'Марс',
             Jupiter: 'Юпитер', Saturn: 'Сатурн', Uranus: 'Уран', Neptune: 'Нептун' };
const focusOrder = [sun, ...planets];
const focusEl = document.getElementById('focus');
const picker = document.getElementById('picker');
const pickBtns = [];
const hex = c => '#' + c.toString(16).padStart(6, '0');
[null, ...focusOrder].forEach(b => {                       // pill 0 = обзор (free roam), then one per body
  const btn = document.createElement('button');
  btn.innerHTML = (b ? `<span class="dot" style="--c:${hex(b.color)}"></span>` : '') + (b ? (RU[b.name] || b.name) : 'обзор');
  btn.onclick = () => setFocus(b);
  picker.appendChild(btn); pickBtns.push(btn);
});
function paintFocus() {
  focusEl.textContent = focus ? '◎ ' + (RU[focus.name] || focus.name) : '◎ обзор';
  const active = focus ? focusOrder.indexOf(focus) + 1 : 0;
  pickBtns.forEach((b, i) => b.classList.toggle('on', i === active));
  pickBtns[active].scrollIntoView({ block: 'nearest', inline: 'center' });
}
function setFocus(b) { focus = b; focusIdx = b ? focusOrder.indexOf(b) : -1; retarget = true; paintFocus(); }
function cycleFocus() { setFocus(focusOrder[(focusIdx + 1) % focusOrder.length]); }
function freeRoam() { setFocus(null); }
paintFocus();

// tap (not drag) on a body in the scene focuses it — the intuitive path; the picker is the visible one
const ray = new THREE.Raycaster();
let dnX = 0, dnY = 0, dnT = 0;
renderer.domElement.addEventListener('pointerdown', e => { dnX = e.clientX; dnY = e.clientY; dnT = performance.now(); retarget = false; }, { passive: true });
renderer.domElement.addEventListener('wheel', () => { retarget = false; }, { passive: true });
renderer.domElement.addEventListener('pointerup', e => {
  if (performance.now() - dnT > 350 || Math.hypot(e.clientX - dnX, e.clientY - dnY) > 6) return;   // that was a drag, not a tap
  const rect = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1,
                                      -((e.clientY - rect.top) / rect.height) * 2 + 1), camera);
  const hit = ray.intersectObjects([sunMesh, ...planetMeshes], true)[0];
  if (!hit) return;
  let o = hit.object; while (o && o !== sunMesh && !planetMeshes.includes(o)) o = o.parent;
  const b = o === sunMesh ? sun : (planetMeshes.includes(o) ? planets[planetMeshes.indexOf(o)] : null);
  if (b) setFocus(b);
}, { passive: true });

recompute();   // set the initial (all-stylized) state + frame the view

// expose a small handle so the camera / modes can be scripted (screenshots from set angles)
window.grav = {
  camera, controls, scene, THREE, real,
  setView(theta, phi, R) {            // spherical around the target: theta=azimuth, phi=polar from +Y
    const t = controls.target;
    camera.position.set(t.x + R * Math.sin(phi) * Math.sin(theta),
                        t.y + R * Math.cos(phi),
                        t.z + R * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(t); controls.update();
  },
  setModes(m) { Object.assign(real, m); for (const k in MODE_LABEL) paintMode(k); recompute(); },
  focusBody(name) { setFocus(name ? focusOrder.find(b => b.name === name) : null); },
  pause(v) { paused = v; },
};

function animate() {
  requestAnimationFrame(animate);
  if (!paused) for (const p of planets) { p.ang += p.speed * 0.02; p.x = Math.cos(p.ang) * p.orbit; p.z = Math.sin(p.ang) * p.orbit; }
  updateGrid();
  const sy = disp(0, 0);
  sunMesh.position.set(0, sy + sun.radius, 0);   // bottom rests at the sheet's low point — sits IN the fabric, never below it
  sunLight.position.set(0, sy + sun.radius, 0);
  if (!paused) { sunMat.uniforms.time.value += 0.026; sunMesh.rotation.y += 0.0012; }   // boil + slow axial spin
  PROM.update(sunMat.uniforms.time.value);   // flow plasma along the magnetic loops
  planets.forEach((p, i) => {
    planetMeshes[i].position.set(p.x, disp(p.x, p.z) + p.radius, p.z);
    if (!paused && p.spin) planetMeshes[i].rotation.y += p.spin;
    if (p._mat) p._mat.uniforms.sunDir.value.copy(sunMesh.position).sub(planetMeshes[i].position).normalize();
  });
  orbitLines.forEach(o => {
    const pos = o.line.geometry.attributes.position;
    for (let k = 0; k < o.N; k++) { const a = k / o.N * Math.PI * 2, x = Math.cos(a) * o.r, z = Math.sin(a) * o.r; pos.setXYZ(k, x, disp(x, z) + 0.6, z); }
    pos.needsUpdate = true;
  });
  // camera: follow the focused body (or ease back to centre), smooth-zooming to frame it
  const pivot = focus ? (focus === sun ? sunMesh.position : planetMeshes[planets.indexOf(focus)].position) : CENTER;
  controls.target.lerp(pivot, 0.15);
  if (retarget) {
    const want = focus ? Math.max(focus.radius * 6, 14) : homeDist;
    const off = camera.position.clone().sub(controls.target);
    const nd = THREE.MathUtils.lerp(off.length(), want, 0.12);
    camera.position.copy(controls.target).add(off.setLength(nd));
    if (Math.abs(nd - want) < Math.max(1, want * 0.02)) retarget = false;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
