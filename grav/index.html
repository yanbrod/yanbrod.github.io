<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grav — how mass curves space</title>
<style>
  html, body { margin: 0; height: 100dvh; background: #0a0e18; overflow: hidden;
               font-family: system-ui, -apple-system, sans-serif;
               touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #title { position: fixed; left: 14px; top: max(12px, env(safe-area-inset-top)); color: #cfe9f0;
           opacity: .85; font-size: clamp(11px, 3.4vw, 13px); letter-spacing: .1em;
           text-transform: uppercase; pointer-events: none; }
  #hud   { position: fixed; left: 14px; right: 78px; bottom: max(12px, env(safe-area-inset-bottom));
           color: #5fbfd0; opacity: .6; font-size: clamp(10px, 3vw, 12px); line-height: 1.5;
           pointer-events: none; }
  #ctrls { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
           display: flex; flex-direction: column; gap: 10px; }
  #ctrls button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2a6b78;
                  background: rgba(10,20,28,.55); color: #9fdbe8; font-size: 19px; line-height: 1;
                  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; }
  #ctrls button:active { background: rgba(34,66,80,.85); }
  @media (min-width: 900px) and (pointer: fine) { #ctrls button { width: 38px; height: 38px; font-size: 15px; } }
</style>
</head>
<body>
<div id="title">Gravity · how mass curves spacetime</div>
<div id="hud"></div>
<div id="ctrls">
  <button id="bPause" aria-label="pause">⏸</button>
  <button id="bOrbit" aria-label="toggle orbits">◍</button>
  <button id="bReset" aria-label="reset view">⟲</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const isTouch = matchMedia('(pointer: coarse)').matches;   // phone/tablet → lighter grid, touch UI

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e18);
scene.fog = new THREE.FogExp2(0x0a0e18, 0.0009);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 6000);
const HOME = new THREE.Vector3(0, 150, 360);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, -45, 0);
controls.maxPolarAngle = Math.PI * 0.495;   // don't go under the sheet
controls.minDistance = 140; controls.maxDistance = 1700; controls.enablePan = false;  // sane on touch
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());          // no long-press menu

scene.add(new THREE.AmbientLight(0x3a5a70, 1.9));
const sunLight = new THREE.PointLight(0xffd9a0, 4.5, 4200, 0.9);
scene.add(sunLight);

// --- starfield ---
(function stars() {
  const N = isTouch ? 2200 : 3800, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1600 + Math.random() * 1800, t = Math.random() * Math.PI * 2,
          p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t); pos[i*3+1] = r*Math.cos(p); pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd8e6, size: 1.5, sizeAttenuation: false })));
})();

// --- masses. Well = the Newtonian potential of a UNIFORM SPHERE (mass, well-radius R):
//     outside r≥R:  −G·mass/r        (the familiar 1/r funnel)
//     inside  r<R:  −G·mass·(3 − r²/R²)/(2R)   (a smooth parabolic bowl → ROUNDED bottom, no spike)
//     The two join C¹-smoothly at r=R. R is the body's "size"; a big R gives a broad, gentle basin. ---
const G = 1;
// the Sun DOMINATES: its 1/r funnel is the slope every planet sits on (that slope is what holds them).
// (real Sun:planet mass ratio is ~1000:1+, so true-to-scale the planet dimples would vanish — this is a
//  stylized balance: Sun deep enough to visibly hold the system, planets still denting their spots.)
const sun = { color: 0xff5a22, radius: 26, mass: 13000, rwell: 100, orbit: 0, speed: 0, ang: 0, x: 0, z: 0 };
const planets = [
  { name: 'Mercury', color: 0x9c8a7a, radius: 3.0, mass: 90,   rwell: 13, orbit: 72,  speed: 0.052 },
  { name: 'Venus',   color: 0xcaa46a, radius: 5.0, mass: 200,  rwell: 17, orbit: 104, speed: 0.039 },
  { name: 'Earth',   color: 0x3f86d6, radius: 5.3, mass: 220,  rwell: 18, orbit: 140, speed: 0.031 },
  { name: 'Mars',    color: 0xc1502e, radius: 4.0, mass: 150,  rwell: 15, orbit: 176, speed: 0.025 },
  { name: 'Jupiter', color: 0xcaa877, radius: 14,  mass: 1300, rwell: 42, orbit: 244, speed: 0.015 },
  { name: 'Saturn',  color: 0xd8c48f, radius: 12,  mass: 1000, rwell: 38, orbit: 312, speed: 0.011, ring: true },
  { name: 'Uranus',  color: 0x9fd8de, radius: 8,   mass: 480,  rwell: 28, orbit: 366, speed: 0.008 },
  { name: 'Neptune', color: 0x4f6fd6, radius: 8,   mass: 480,  rwell: 28, orbit: 414, speed: 0.006 },
];
planets.forEach(p => { p.ang = Math.random() * Math.PI * 2; });
const masses = [sun, ...planets];

// sum each body's uniform-sphere well (down = negative y)
function disp(x, z) {
  let y = 0;
  for (const m of masses) {
    const dx = x - m.x, dz = z - m.z, r = Math.sqrt(dx*dx + dz*dz), R = m.rwell;
    y -= (r >= R) ? G * m.mass / r : G * m.mass * (3 - (r*r)/(R*R)) / (2 * R);
  }
  return y;
}

// --- the spacetime sheet (wireframe grid, displaced by disp) ---
const S = 1300, SEG = isTouch ? 150 : 240;   // fewer verts on phones (grid is re-displaced every frame)
const gridGeo = new THREE.PlaneGeometry(S, S, SEG, SEG);
const grid = new THREE.Mesh(gridGeo, new THREE.MeshBasicMaterial({ color: 0x2ad0e6, wireframe: true, transparent: true, opacity: 0.6 }));
grid.rotation.x = -Math.PI / 2;              // lie flat; local +z displacement → world +y
scene.add(grid);
const gp = gridGeo.attributes.position;
const gx = new Float32Array(gp.count), gz = new Float32Array(gp.count);
for (let i = 0; i < gp.count; i++) { gx[i] = gp.getX(i); gz[i] = -gp.getY(i); }   // local (x,y) → world (x,-y)
function updateGrid() { for (let i = 0; i < gp.count; i++) gp.setZ(i, disp(gx[i], gz[i])); gp.needsUpdate = true; }

// --- sun (glowing) + planets ---
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sun.radius, 40, 40), new THREE.MeshBasicMaterial({ color: sun.color }));
scene.add(sunMesh);
const glow = new THREE.Mesh(new THREE.SphereGeometry(sun.radius * 2.1, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff8a3c, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
sunMesh.add(glow);

const planetMeshes = planets.map(p => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 28, 28),
    new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.05,
      emissive: p.color, emissiveIntensity: 0.4 }));
  if (p.ring) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(p.radius * 1.5, p.radius * 2.3, 48),
      new THREE.MeshBasicMaterial({ color: 0xd8c48f, side: THREE.DoubleSide, transparent: true, opacity: 0.5 }));
    ring.rotation.x = -Math.PI / 2.3; m.add(ring);
  }
  scene.add(m); return m;
});

// --- warped orbit rings drawn on the sheet ---
let showOrbits = true;
const orbitLines = planets.map(p => {
  const N = 200, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  const line = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x49b8ce, transparent: true, opacity: 0.55 }));
  scene.add(line); return { line, N, r: p.orbit };
});

let paused = false;
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === 'o') { showOrbits = !showOrbits; orbitLines.forEach(o => o.line.visible = showOrbits); }
  if (e.key === 'r') { camera.position.copy(HOME); controls.target.set(0, -45, 0); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// expose a small handle so the camera can be scripted (screenshots from set angles)
window.grav = {
  camera, controls, scene, THREE,
  setView(theta, phi, R) {            // spherical around the target: theta=azimuth, phi=polar from +Y
    const t = controls.target;
    camera.position.set(t.x + R * Math.sin(phi) * Math.sin(theta),
                        t.y + R * Math.cos(phi),
                        t.z + R * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(t); controls.update();
  },
  pause(v) { paused = v; },
};

// --- on-screen controls (work on touch, where there's no keyboard) + gesture-aware hint ---
document.getElementById('hud').innerHTML = isTouch
  ? 'one finger — rotate · two fingers — pinch to zoom'
  : 'drag to orbit · scroll to zoom · <b>space</b> pause · <b>o</b> orbits · <b>r</b> reset';
const bPause = document.getElementById('bPause'),
      bOrbit = document.getElementById('bOrbit'),
      bReset = document.getElementById('bReset');
bPause.onclick = () => { paused = !paused; bPause.textContent = paused ? '▶' : '⏸'; };
bOrbit.onclick = () => { showOrbits = !showOrbits; orbitLines.forEach(o => o.line.visible = showOrbits); bOrbit.style.opacity = showOrbits ? 1 : .4; };
bReset.onclick = () => { camera.position.copy(HOME); controls.target.set(0, -45, 0); };

function animate() {
  requestAnimationFrame(animate);
  if (!paused) for (const p of planets) { p.ang += p.speed * 0.02; p.x = Math.cos(p.ang) * p.orbit; p.z = Math.sin(p.ang) * p.orbit; }
  updateGrid();
  const sy = disp(0, 0);
  sunMesh.position.set(0, sy + sun.radius, 0);   // bottom rests at the sheet's low point — sits IN the fabric, never below it
  sunLight.position.set(0, sy + sun.radius, 0);
  planets.forEach((p, i) => planetMeshes[i].position.set(p.x, disp(p.x, p.z) + p.radius * 0.6, p.z));
  orbitLines.forEach(o => {
    const pos = o.line.geometry.attributes.position;
    for (let k = 0; k < o.N; k++) { const a = k / o.N * Math.PI * 2, x = Math.cos(a) * o.r, z = Math.sin(a) * o.r; pos.setXYZ(k, x, disp(x, z) + 0.6, z); }
    pos.needsUpdate = true;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
